<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- # titulo-->
    <div class="container-fluid vh-100 d-flex justify-content-center align-items-center">
        <div class="row">
            <div class="col">

                <form class="border border-2 rounded p-5 m-5  w-100">

                    <div class="row">
                        <!-- nombre-->
                        <div class="col ">
                            <label for="form-control" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre-cliente" placeholder="Ej. pedro"
                                required>
                        </div>
                        <!-- numero-->
                        <div class="col position-relative">
                            <label for="form-control" class="form-label">Numero </label>
                            <input type="text" class="form-control" id="numero-cliente" placeholder="Ej. +56 945763256"
                                required>
                        </div>
                    </div>

                    <div class="row">
                        <!-- email-->
                        <div class="col position-relative">
                            <label for="form-control" class="form-label">Email</label>
                            <input type="email" class="form-control" id="Email-cliente"
                                placeholder="Ej. pedrovet@gmail.com" required>
                        </div>
                    </div>
                    <!-- nombre mascota-->

                    <div class="col">
                        <label for="form-control" class="form-label">Nombre mascota</label>
                        <input type="text" class="form-control" id="nombre-mascota" placeholder="Cholo" required>
                    </div>







                    <div class="col d-flex justify-content-center mt-4 p-3">
                        <button class="btn btn-primary btn-lg w-50 " type="submit">Agendar</button>
                    </div>

                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3198.6672953209973!2d174.71532251192946!3d-36.70653207215821!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6d0d3b09b7693cdd%3A0x629c3ad7b8283b56!2s73%20Rising%20Parade%2C%20Fairview%20Heights%2C%20Auckland%200632!5e0!3m2!1ses!2snz!4v1787385666461!5m2!1ses!2snz" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

                    
                </form>
            </div>
        </div>
    </div>







    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
